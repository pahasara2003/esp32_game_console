[env:video-test]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    bitbank2/JPEGDEC@1.8.5
build_unflags = -Os
build_flags =
    -O3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_CS=4
    -DTFT_MOSI=2
    -DTFT_MISO=21
    -DTFT_SCLK=1
    -DTFT_DC=3
    -DTFT_RST=-1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_INVERSION_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000
