[env:touch-test]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_CS=3
    -DTFT_MOSI=0
    -DTFT_SCLK=4
    -DTFT_DC=1
    -DTFT_RST=2
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_INVERSION_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=10000000
    -DSPI_READ_FREQUENCY=6000000
    -DSPI_TOUCH_FREQUENCY=500000
    -DTOUCH_CS=21
    -DTFT_MISO=7
