; PlatformIO Project Configuration File for ESP32-C3 + ILI9341 Display
;
; Customized with your modified TFT_eSPI library (in lib/TFT_eSPI)
; and your exact hardware pinout (Setup70c_ESP32_C3_ILI9341.h)
;
; Please visit documentation for other options and examples:
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv
board_build.embed_files =
    assets/nokia_welcome.mp3
    assets/puzzle_mozart.wav

; Serial Monitor
monitor_speed = 115200

; USB CDC on Boot: enables Serial output over native USB on ESP32-C3 boards
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DPNG_MAX_BUFFERED_PIXELS=8256

lib_deps = 
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.1
    Wire
    earlephilhower/ESP8266Audio@1.9.7
    bitbank2/JPEGDEC@1.8.5
    bitbank2/PNGdec@1.1.6
