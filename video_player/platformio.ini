; Standalone MJPEG + WAV video player test (no menu).
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv
board_build.f_cpu = 160000000L
monitor_speed = 115200
lib_extra_dirs = ../lib
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -O2
lib_deps =
    bitbank2/JPEGDEC@1.8.5
